<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>오프라인 · MyPace</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #0a0a0b;
        color: #fafafa;
        font-family: "Pretendard Variable", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        gap: 18px;
      }
      .mark {
        width: 72px;
        height: 72px;
        filter: drop-shadow(0 0 24px rgba(212, 255, 63, 0.35));
      }
      h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
      p { color: #9ca3af; font-size: 14px; margin: 0; max-width: 280px; line-height: 1.6; }
      button {
        margin-top: 8px;
        height: 46px;
        padding: 0 24px;
        border: none;
        border-radius: 999px;
        background: #d4ff3f;
        color: #0a0a0b;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M150 340 L150 178 L256 292 L362 178 L362 340" fill="none" stroke="#d4ff3f" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="256" cy="372" r="15" fill="#d4ff3f" />
    </svg>
    <h1>오프라인 상태예요</h1>
    <p>인터넷 연결이 끊겼습니다. 이미 열어본 화면은 계속 사용할 수 있어요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </body>
</html>
